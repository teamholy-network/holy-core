name: Build and Upload Gradle Shadow JAR

on:
  push:
    branches:
      - master

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      # Checkout des Repositories
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Setze Java-Version
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'  # Passe die Java-Version an, falls nötig

      # Gradle-Wrapper verwenden und Shadow JAR bauen
      - name: Build JAR with Gradle ShadowJar
        run: ./gradlew clean shadowJar

      # Verifizieren, dass die JAR-Datei erstellt wurde
      - name: Verify JAR file
        run: ls -l build/libs/*.jar

      # Hochladen auf die angegebene URL
      - name: Upload JAR to HTTP Server
        env:
          UPLOAD_URL: "http://updaterapi.skydb.de/uploadupdate?uuid=9904be1f-f450-4bfb-aaa3-22baa3d9d019&uploadkey=HLMFbff3QZ85E4iBqy1PLq"
        run: |
          JAR_FILE=$(ls build/libs/*-all.jar | head -n 1)
          if [ -f "$JAR_FILE" ]; then
            curl -X POST "$UPLOAD_URL" \
              -F "file=@$JAR_FILE"
          else
            echo "Error: No JAR file found to upload."
            exit 1
          fi
