name: Publish holy-core to GitHub Packages

on:
    push:
        branches: [ "main" ]
        tags:
            - "*"

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        env:
            GITHUB_ACTOR: ${{ github.actor }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up JDK
              uses: actions/setup-java@v4
              with:
                  java-version: '17'
                  distribution: 'temurin'

            - name: Make gradlew executable
              run: chmod +x gradlew

            - name: Publish modules to GitHub Packages
              run: |
                  if [ "$GITHUB_REF_TYPE" = "tag" ]; then
                      VERSION="${GITHUB_REF_NAME#v}"
                  else
                      VERSION=$(grep '^projectVersion=' gradle.properties | cut -d= -f2)
                  fi
                  STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "$GITHUB_ACTOR:$GITHUB_TOKEN" \
                      "https://maven.pkg.github.com/teamholy-network/holy-core/de/teamholy/holy-core-api/$VERSION/holy-core-api-$VERSION.pom")
                  if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
                      echo "Version $VERSION existiert bereits auf GitHub Packages - Publish wird uebersprungen."
                      exit 0
                  fi
                  ./gradlew clean publish -PprojectVersion="$VERSION"
