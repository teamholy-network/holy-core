name: Publish holy-core to Nexus

on:
    push:
        branches: [ "main" ]
        tags:
            - "*"

jobs:
    publish:
        runs-on: ubuntu-latest
        env:
            HolyRepoUser: ${{ secrets.HolyRepoUser }}
            HolyRepoPass: ${{ secrets.HolyRepoPass }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up JDK
              uses: actions/setup-java@v4
              with:
                  java-version: '17'
                  distribution: 'temurin'

            - name: Make gradlew executable
              run: chmod +x gradlew

            - name: Publish modules to Nexus
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  ./gradlew clean publish -PprojectVersion="$VERSION"
