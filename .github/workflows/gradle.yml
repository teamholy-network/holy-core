name: Build and Upload Gradle Shadow JAR

on:
  push:
    branches:
      - main

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    environment: production

    steps:
      # Checkout des Repositories
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Setze Java-Version
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'  # Passe die Java-Version an, falls nötig

      # Gradle-Wrapper ausführbar machen und Shadow JAR bauen
      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build JAR with Gradle ShadowJar
        run: ./gradlew clean shadowJar

      # Verifizieren, dass die JAR-Dateien erstellt wurden
      - name: Verify JAR files
        run: ls -l output/*.jar

      # Hochladen der JAR-Dateien auf die angegebene URL
      - name: Upload JARs to HTTP Server
        env:
          VERSION: 2.7.2
          BUKKIT_MARKUPAPI_UUID: ${{ secrets.BUKKIT_MARKUPAPI_UUID }}
          BUKKIT_MARKUPAPI_KEY: ${{ secrets.BUKKIT_MARKUPAPI_KEY }}
          BUNGEE_CORE_API_UUID: ${{ secrets.BUNGEE_CORE_API_UUID }}
          BUNGEE_CORE_API_KEY: ${{ secrets.BUNGEE_CORE_API_KEY }}
          BUNGEE_LOGIN_UUID: ${{ secrets.BUNGEE_LOGIN_UUID }}
          BUNGEE_LOGIN_KEY: ${{ secrets.BUNGEE_LOGIN_KEY }}
          BUKKIT_CORE_API_UUID: ${{ secrets.BUKKIT_CORE_API_UUID }}
          BUKKIT_CORE_API_KEY: ${{ secrets.BUKKIT_CORE_API_KEY }}
        run: |
          declare -A UPLOAD_DETAILS

          # UUID und Upload-Key für jede Datei
          UPLOAD_DETAILS["output/bukkit-markupapi-${VERSION}-all.jar"]="${BUKKIT_MARKUPAPI_UUID}:${BUKKIT_MARKUPAPI_KEY}"
          UPLOAD_DETAILS["output/bungee-core-api-${VERSION}-all.jar"]="${BUNGEE_CORE_API_UUID}:${BUNGEE_CORE_API_KEY}"
          UPLOAD_DETAILS["output/bungee-login-${VERSION}-all.jar"]="${BUNGEE_LOGIN_UUID}:${BUNGEE_LOGIN_KEY}"
          UPLOAD_DETAILS["output/bukkit-core-api-${VERSION}-all.jar"]="${BUKKIT_CORE_API_UUID}:${BUKKIT_CORE_API_KEY}"

          for JAR_FILE in "${!UPLOAD_DETAILS[@]}"; do
            if [ -f "$JAR_FILE" ]; then
              UUID_KEY=${UPLOAD_DETAILS[$JAR_FILE]}
              UUID=${UUID_KEY%%:*}
              UPLOAD_KEY=${UUID_KEY##*:}

              UPLOAD_URL="http://updaterapi.skydb.de/uploadupdate?uuid=$UUID&uploadkey=$UPLOAD_KEY"
              
              curl -X POST "$UPLOAD_URL" \
                -F "file=@$JAR_FILE"
              echo "Uploaded $JAR_FILE successfully."
            else
              echo "Error: $JAR_FILE not found."
              exit 1
            fi
          done
