name: Build, Test & Publish to GitHub Packages

on:
    push:
        branches: [ "development" ]
        tags:
            - "v*"
    pull_request:
        branches: [ "development" ]

permissions:
    contents: read
    packages: write

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: '17'
                  distribution: 'temurin'
                  cache: 'gradle'

            - name: Make gradlew executable
              run: chmod +x gradlew

            - name: Build
              run: ./gradlew build -x test

            - name: Test
              run: ./gradlew test

    publish:
        runs-on: ubuntu-latest
        needs: build-and-test
        if: github.event_name == 'push'

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: '17'
                  distribution: 'temurin'
                  cache: 'gradle'

            - name: Make gradlew executable
              run: chmod +x gradlew

            - name: Determine version
              id: version
              run: |
                  if [[ "$GITHUB_REF" == refs/tags/* ]]; then
                    echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
                  else
                    echo "version=$(grep '^projectVersion' gradle.properties | cut -d= -f2)" >> $GITHUB_OUTPUT
                  fi

            - name: Publish to GitHub Packages
              run: ./gradlew publishAllPublicationsToGitHubPackagesRepository -PprojectVersion="${{ steps.version.outputs.version }}"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_ACTOR: ${{ github.actor }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
