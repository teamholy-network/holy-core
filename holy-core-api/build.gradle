plugins {
    id 'java-library'
}

dependencies {
    api("eu.koboo:en2do:$en2doVersion")
    api("org.redisson:redisson:$redissonVersion")
    api("org.jetbrains:annotations:$jetbrainsAnnotationsVersion")
    api("com.rabbitmq:amqp-client:$rabbitMqVersion")
    api('com.esotericsoftware.yamlbeans:yamlbeans:1.17')
    api("de.skydb.translationapi:TranslateAPI-Bindings:$translationBindingsVersion")

    compileOnly("de.dytanic.cloudnet:cloudnet-bridge:$cloudnetVersion")
    compileOnly("de.dytanic.cloudnet:cloudnet-wrapper-jvm:$cloudnetVersion")
}