dependencies {
    implementation 'org.jetbrains:annotations:24.0.0'
    compileOnly("org.spigotmc:spigot:$spigotVersion")
    compileOnly("org.spigotmc:spigot-api:$spigotVersion")

    implementation("eu.koboo:en2do:$en2doVersion")
    implementation("org.redisson:redisson:$redissonVersion")
    implementation("org.jetbrains:annotations:$jetbrainsAnnotationsVersion")

    compileOnly("de.dytanic.cloudnet:cloudnet-bridge:$cloudnetVersion")
    compileOnly("de.dytanic.cloudnet:cloudnet-wrapper-jvm:$cloudnetVersion")
    compileOnly 'com.gmail.filoghost.holographicdisplays:holographicdisplays-api:2.4.9'

    implementation("eu.koboo:yaml-config:$yamlVersion")

    compileOnly("com.comphenix.protocol:ProtocolLib:5.1.0")
    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.2'


    implementation(project(':holy-core-api'))
    compileOnly(project(':bukkit-markupapi'))
}

repositories {
    mavenLocal();
    maven { url "https://repo.dmulloy2.net/repository/public/" }
}
